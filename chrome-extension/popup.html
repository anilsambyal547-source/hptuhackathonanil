<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    h3 {
      margin: 0 0 6px 0;
      font-size: 15px;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      font-size: 11px;
      color: #94a3b8;
      margin: 0 0 12px 0;
      line-height: 1.4;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      background: #0f172a;
      border: 1px solid #334155;
      color: #f1f5f9;
      padding: 8px;
      border-radius: 8px;
      font-size: 11px;
      font-family: monospace;
      resize: vertical;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      background: #0284c7;
      color: #090d16;
      font-weight: 700;
      padding: 9px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover {
      background: #38bdf8;
    }
  </style>
</head>
<body>
  <h3>🛡️ SafeGuard AI Shield</h3>
  <p>Deterministic Zero-Fetch Phishing & Smishing Scanner</p>
  <textarea id="scan-text" rows="4" placeholder="Paste link or text to scan..."></textarea>
  <button id="scan-btn">Analyze with SafeGuard AI</button>
  <script src="popup.js"></script>
</body>
</html>
